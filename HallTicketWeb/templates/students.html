{% extends "layout.html" %}
{% block content %}
<div class="row align-items-center mb-4 g-3">
    <div class="col-12 col-md-6">
        <h2 class="text-white m-0">Student Management</h2>
    </div>
    <div class="col-12 col-md-6 text-md-end">
        <button class="btn btn-neon mb-2 mb-md-0 me-md-2 w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#studentModal" 
                onclick="document.getElementById('formStudent').reset(); document.getElementById('origRoll').value='';">
            <i class="fas fa-plus me-2"></i>Add New
        </button>
        <button class="btn btn-outline-light mb-2 mb-md-0 w-100 w-md-auto" data-bs-toggle="modal" data-bs-target="#importModal">
            <i class="fas fa-file-upload me-2"></i>Import
        </button>
        <a href="{{ url_for('students_sample_csv') }}" class="btn btn-outline-info w-100 w-md-auto">
            <i class="fas fa-download me-2"></i>Sample CSV
        </a>
    </div>
</div>

<form class="glass-card row g-3 mb-4 align-items-center" method="GET">
    <div class="col-6 col-md-3">
        <select name="dept" class="form-select">
            <option value="">Dept</option>
            {% for d in depts %}<option value="{{d}}" {% if request.args.get('dept')==d %}selected{% endif %}>{{d}}</option>{% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-3">
        <select name="sem" class="form-select">
            <option value="">Sem</option>
            {% for s in sems %}<option value="{{s}}" {% if request.args.get('sem')==s %}selected{% endif %}>{{s}}</option>{% endfor %}
        </select>
    </div>
    <div class="col-6 col-md-2">
        <select name="year" class="form-select">
            <option value="">Year</option>
            {% for y in years %}<option value="{{y}}" {% if request.args.get('year')==y|string %}selected{% endif %}>{{y}}</option>{% endfor %}
        </select>
    </div>
    <div class="col-12 col-md-3">
        <div class="input-group">
            <span class="input-group-text bg-transparent text-white border-secondary"><i class="fas fa-search"></i></span>
            <input type="text" name="search" class="form-control" placeholder="Roll No or Name" value="{{ request.args.get('search', '') }}">
        </div>
    </div>
    <div class="col-12 col-md-1">
        <button class="btn btn-info w-100 fw-bold">Filter</button>
    </div>
</form>

<div class="row mb-3">
    <div class="col-12 col-md-4">
        <form method="GET" action="{{ url_for('export_students') }}" class="d-flex">
            <select name="dept" class="form-select bg-transparent text-white border-secondary me-2">
                <option value="">All Depts</option>
                {% for d in depts %}<option value="{{d}}">{{d}}</option>{% endfor %}
            </select>
            <button class="btn btn-outline-light text-nowrap" type="submit"><i class="fas fa-file-export me-1"></i>Export</button>
        </form>
    </div>
</div>

<div class="glass-card p-0 overflow-hidden">
    <div class="table-responsive">
        <table class="table table-glass table-hover mb-0">
            <thead>
                <tr>
                    <th class="ps-4">Roll No</th>
                    <th>Name</th>
                    <th>Dept</th>
                    <th>Sem</th>
                    <th class="d-none d-md-table-cell">Gender</th> 
                    <th class="text-end pe-4">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for s in students %}
                <tr>
                    <td class="ps-4"><span class="badge bg-secondary bg-opacity-50 border border-secondary">{{s[0]}}</span></td>
                    <td class="fw-bold text-nowrap">{{s[1]}}</td>
                    <td class="text-info">{{s[3]}}</td>
                    <td>{{s[5]}}</td>
                    <td class="d-none d-md-table-cell">{{s[2]}}</td>
                    <td class="text-end pe-4 text-nowrap">
                        <button class="btn btn-sm btn-outline-warning me-1" data-bs-toggle="modal" data-bs-target="#studentModal" 
                        onclick="fillModal('studentModal', {roll_number: '{{s[0]}}', original_roll: '{{s[0]}}', name: '{{s[1]}}', gender: '{{s[2]}}', department: '{{s[3]}}', regulation: '{{s[4]}}', semester: '{{s[5]}}', year: '{{s[6]}}', mobile: '{{s[7]}}', father_name: '{{s[8]}}', mother_name: '{{s[9]}}', dob: '{{s[10]}}', section: '{{s[11]}}', caste: '{{s[12]}}' });">
                            <i class="fas fa-edit"></i>
                        </button>
                        <a href="{{ url_for('backlogs', roll_number=s[0]) }}" class="btn btn-sm btn-outline-info me-1">
                            <i class="fas fa-list"></i>
                        </a>
                        <form method="POST" style="display:inline;" onsubmit="return confirm('Delete Student?');">
                            <input type="hidden" name="delete_roll" value="{{s[0]}}">
                            <button class="btn btn-sm btn-outline-danger"><i class="fas fa-trash"></i></button>
                        </form>
                    </td>
                </tr>
                {% else %}
                <tr><td colspan="6" class="text-center py-4 text-muted">No students found matching criteria.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="studentModal">
    <div class="modal-dialog modal-lg modal-dialog-scrollable"> <form method="POST" class="modal-content glass-card p-0" id="formStudent">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title text-info">Student Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body row g-3">
                <input type="hidden" name="original_roll" id="origRoll">
                <div class="col-12 col-md-6"><label class="small text-muted">Roll Number</label><input type="text" name="roll_number" class="form-control" required></div>
                <div class="col-12 col-md-6"><label class="small text-muted">Name</label><input type="text" name="name" class="form-control" required></div>
                <div class="col-12 col-md-6"><label class="small text-muted">Father Name</label><input type="text" name="father_name" class="form-control"></div>
                <div class="col-12 col-md-6"><label class="small text-muted">Mother Name</label><input type="text" name="mother_name" class="form-control"></div>
                <div class="col-12 col-md-6"><label class="small text-muted">DOB</label><input type="date" name="dob" class="form-control"></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Gender</label><select name="gender" class="form-select"><option>Male</option><option>Female</option></select></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Mobile</label><input type="text" name="mobile" class="form-control"></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Year</label><input type="number" name="year" class="form-control" value="1"></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Dept</label><select name="department" class="form-select">{% for d in depts %}<option>{{d}}</option>{% endfor %}</select></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Sem</label><select name="semester" class="form-select">{% for s in sems %}<option>{{s}}</option>{% endfor %}</select></div>
                <div class="col-6 col-md-4"><label class="small text-muted">Reg</label><select name="regulation" class="form-select">{% for r in regs %}<option>{{r}}</option>{% endfor %}</select></div>
                <div class="col-12 col-md-4"><label class="small text-muted">Section</label><input type="text" name="section" class="form-control"></div>
                <div class="col-12 col-md-4"><label class="small text-muted">Caste</label><input type="text" name="caste" class="form-control"></div>
            </div>
            <div class="modal-footer border-top-0">
                <button class="btn btn-neon w-100">Save Information</button>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="importModal">
    <div class="modal-dialog">
        <form method="POST" enctype="multipart/form-data" class="modal-content glass-card p-0">
            <div class="modal-header border-bottom-0"><h5>Import Data</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="file" name="import_file" class="form-control" accept=".csv,.xlsx"
                       onchange="validateCsv(this, 'students', 'studentsCsvValidationResult')" required>
                <div id="studentsCsvValidationResult" class="mt-2 small"></div>
            </div>
            <div class="modal-footer border-top-0"><button class="btn btn-success w-100">Upload CSV</button></div>
        </form>
    </div>
</div>
{% endblock %}
