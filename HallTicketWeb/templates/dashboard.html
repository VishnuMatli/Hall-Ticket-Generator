{% extends "layout.html" %}
{% block content %}
<h2 class="mb-4 text-white">System Overview</h2>

<div class="row g-4">
    <div class="col-md-4">
        <div class="glass-card text-center h-100 d-flex flex-column justify-content-center">
            <div class="display-1 text-info mb-2"><i class="fas fa-users"></i></div>
            <h1 class="display-4 fw-bold text-white">{{ counts.student }}</h1>
            <p class="text-muted text-uppercase letter-spacing-2">Active Students</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="glass-card text-center h-100 d-flex flex-column justify-content-center">
            <div class="display-1 text-success mb-2"><i class="fas fa-book-open"></i></div>
            <h1 class="display-4 fw-bold text-white">{{ counts.subject }}</h1>
            <p class="text-muted text-uppercase letter-spacing-2">Curriculum Subjects</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="glass-card text-center h-100 d-flex flex-column justify-content-center">
            <div class="display-1 text-warning mb-2"><i class="fas fa-university"></i></div>
            <h1 class="display-4 fw-bold text-white">{{ counts.dept }}</h1>
            <p class="text-muted text-uppercase letter-spacing-2">Departments</p>
        </div>
    </div>
</div>
{% endblock %}
